name: Marketplace checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eneba-marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - run: npm ci
      - run: npm run check && npm run build
      - run: php tests/security.php && php tests/stripe.php && sh tests/order-access.sh
      - run: npx playwright install --with-deps chromium
      - run: |
          php server/setup.php
          php -S 127.0.0.1:4178 -t dist server/router.php > /tmp/marketplace.log 2>&1 &
          npx playwright test
        env:
          APP_ENV: development
          SESSION_COOKIE_SECURE: 'false'
